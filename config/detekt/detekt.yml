# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  PackageNaming:
    # Allow underscores, e.g. com.app.features.feature_one
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9_]*)*'

style:
  UnusedPrivateMember:
    # @Preview functions are only used by the IDE.
    ignoreAnnotated: ['Preview']
